<app-header (navegar)="mudarAba($event)"></app-header>

<main>
  @if (abaAtual() === 'inicio') {
    <app-hero (navegar)="mudarAba($event)"></app-hero>
  }
  @if (abaAtual() === 'servicos') {
    <app-services></app-services>
  }
  @if (abaAtual() === 'contato') {
    <app-contact></app-contact>
  }
  @if (abaAtual() === 'admin') {
    <app-admin></app-admin>
  }
</main>
